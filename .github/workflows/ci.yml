name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Show coverage
        if: runner.os == 'Linux'
        run: go tool cover -func coverage.out

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Fuzz errors (5s)
        run: go test -run '^$' -fuzz '^FuzzIsTimeout$' -fuzztime=5s .

      - name: Fuzz retryable (5s)
        run: go test -run '^$' -fuzz '^FuzzIsRetryable$' -fuzztime=5s .

      - name: Fuzz backoff (5s)
        run: go test -run '^$' -fuzz '^FuzzBackoff$' -fuzztime=5s .

      - name: Fuzz redirect (5s)
        run: go test -run '^$' -fuzz '^FuzzRedirect$' -fuzztime=5s .

  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build and vet examples
        run: |
          for dir in basic retry session limit http3; do
            if [ -d examples/$dir ]; then
              (cd examples/$dir && go build ./... && go vet ./...)
            fi
          done

  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run benchmarks (baseline only, no gate)
        run: go test -run '^$' -bench . -benchmem -benchtime=1s . | tee bench.log

      - name: Upload benchmark log
        uses: actions/upload-artifact@v7
        with:
          name: bench-log
          path: bench.log

  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: go.mod drift check
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod/go.sum 漂移,请执行 go mod tidy 后提交"
            exit 1
          fi

  apidiff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@latest

      # 只报告 API 差异,不设硬性门禁:<1.0.0 允许有意的破坏性变更。
      - name: API diff vs previous tag (informational)
        continue-on-error: true
        run: |
          PREV=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "$PREV" ]; then
            echo "无上一版本 tag,跳过 apidiff"
            exit 0
          fi
          git worktree add /tmp/httpx-prev "$PREV" >/dev/null
          (cd /tmp/httpx-prev && apidiff -w /tmp/httpx-old.export github.com/lcylpzls/httpx)
          apidiff -w /tmp/httpx-new.export github.com/lcylpzls/httpx
          apidiff /tmp/httpx-old.export /tmp/httpx-new.export
          git worktree remove /tmp/httpx-prev --force

  vuln:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
